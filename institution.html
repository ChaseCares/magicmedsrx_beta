<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Institutional</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<!-- Only increment the last digit -->
		<link rel="stylesheet" href="./styles/stylesheet.css?v=0.5.0" />
	</head>
	<body>
		<header id="site-header" class="site-header"></header>

		<main class="container">
			<section class="hero">
				<h1>Institutional Programs</h1>
				<p>
					Programs are grouped by manufacturer. Select a program to view medications and access
					application links.
				</p>

				<div class="search-bar">
					<input
						id="search"
						type="search"
						placeholder="Search manufacturer or medication..."
						aria-label="Search"
					/>
				</div>
			</section>

			<section id="programs-list">
				<div class="program-card">
					<div class="program-header">
						<div>
							<h3>Example Pharma — Patient Assistance Program</h3>
							<div class="program-meta">Type: PAP • Eligibility: Uninsured or income-based</div>
						</div>
						<div>
							<a class="apply-btn" href="#" target="_blank">Apply</a>
						</div>
					</div>
					<div class="drug-list">
						<ul>
							<li>Medication A</li>
							<li>Medication B</li>
							<li>Medication C</li>
						</ul>
					</div>
				</div>
			</section>
		</main>

		<script>
			document.getElementById('search').addEventListener('input', function (e) {
				const q = e.target.value.toLowerCase();
				const cards = document.querySelectorAll('.program-card');
				cards.forEach((card) => {
					const text = card.innerText.toLowerCase();
					card.style.display = text.includes(q) ? '' : 'none';
				});
			});
		</script>

		<footer id="footerContainer"></footer>

		<!-- Only increment the last digit -->
		<script
			src="./js/include.js?v=0.1.2"
			onload="
				mkNavBar();
				mkFooter();
			"
		></script>
	</body>
</html>
